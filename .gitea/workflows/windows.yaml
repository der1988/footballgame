name: Build Windows Release
run-name: Build Windows Release
on:
  push:
    tags:
      v*

jobs:
  Build-Windows:
    runs-on: windows
    steps:
      - run: echo "Building release for Windows operating system"
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Build game
        run: |
          make -f Makefile.w64
          echo "Game built"
      - name: Create release
        run: |
          mkdir release
          cp build/thegame.exe release
          cp -R res release
          cd release
          zip -r release.zip *
          $id = curl.exe --% -vv "https://git.mtormento.com/api/v1/repos/MoonyBaboon/footballgame/releases/tags/${{gitea.ref_name}}" -H "accept: application/json" -H "Authorization: token ${{secrets.API_TOKEN}}" -H "Content-Type: application/json" | jq '.id'
          if ( $id -eq "null" ) {
            $id = curl.exe --% -vv "https://git.mtormento.com/api/v1/repos/MoonyBaboon/footballgame/releases" -d "{""tag_name"":""${{gitea.ref_name}}""}" -H "accept: application/json" -H "Authorization: token ${{secrets.API_TOKEN}}" -H "Content-Type: application/json" | jq '.id'
            echo "Release created"
          } else {
            echo "Release found"
          }
          curl.exe -vv "https://git.mtormento.com/api/v1/repos/MoonyBaboon/footballgame/releases/$id/assets?name=footballgame_win.zip" -H "Authorization: token ${{secrets.API_TOKEN}}" -H "Content-Type: multipart/form-data" -F "attachment=@release.zip;type=application/zip"
          echo "Archive uploaded"
