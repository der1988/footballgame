name: Build Windows Release
run-name: Build Windows Release
on: [push]

jobs:
  Build-Windows:
    runs-on: windows
    steps:
      - run: echo "Building release for Windows operating system"
      - name: Check out repository code
        uses: actions/checkout@v3
      - run: echo "The ${{ gitea.repository }} repository has been cloned to the runner."
      - name: Build game
        run: |
          make -f Makefile.w64
          echo "Game built"
